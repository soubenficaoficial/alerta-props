# ------------------------------------------------------------------
# Configuração do bot de alertas de props (basquetebol)
# ------------------------------------------------------------------

# Texto que, se aparecer na página de um jogo, indica que já há mercados de jogador.
# Ajusta depois de veres como cada casa chama os separadores.
palavras_props:
  - "pontos do jogador"
  - "jogador - pontos"
  - "props de jogador"
  - "mercados de jogador"
  - "jogadores"
  - "ressaltos"
  - "assistências"
  - "triplos marcados"
  - "pontos + ressaltos"
  # inglês (SpinHub)
  - "player points"
  - "player rebounds"
  - "player assists"
  - "player props"
  - "player specials"
  - "points + rebounds"
  - "three pointers made"

# Se alguma destas frases aparecer, assume-se que o site bloqueou o acesso.
frases_bloqueio:
  - "não está disponível na sua região"
  - "não está disponível no seu país"
  - "not available in your"
  - "access denied"
  - "acesso negado"
  - "verify you are human"
  - "verifique que é humano"

espera_ms: 4000            # tempo para a página carregar
max_jogos_por_liga: 15     # só os próximos X jogos de cada liga
pausa_segundos: 2          # pausa entre jogos (não martelar os sites)

# ------------------------------------------------------------------
# LIGAS
# Para cada uma: abre a página da liga no site da casa (no PC, não na app),
# copia o link da barra de endereço e cola em "url".
# padrao_jogo: expressão que identifica os links de jogos (opcional).
#   Se ficar vazio, o bot usa uma regra genérica (links com um ID numérico).
#   Se não apanhar os jogos certos, corre: python bot.py --descobrir
# ativo: false desliga a liga sem a apagar.
# ------------------------------------------------------------------
ligas:
  # ---------- Betano ----------
  - casa: Betano
    liga: NBA
    url: "COLA_AQUI_O_LINK"
    padrao_jogo: ""
